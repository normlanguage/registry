name: Publish Norm module
description: Attest and publish a verified NAR as an immutable tagged release
inputs:
  archive:
    description: Verified archive output from package-module
    required: true
  version:
    description: Verified version output from package-module
    required: true
runs:
  using: composite
  steps:
    - uses: actions/attest-build-provenance@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        subject-path: ${{ inputs.archive }}
    - if: startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        ARCHIVE: ${{ inputs.archive }}
        VERSION: ${{ inputs.version }}
      run: |
        $ErrorActionPreference = 'Stop'
        if ($env:GITHUB_REF_NAME -cne "v$env:VERSION") { throw 'Tag differs from packaged module version' }
        $releases = gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases" --slurp
        if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect existing releases' }
        $existing = @(($releases | ConvertFrom-Json) | ForEach-Object { $_ } | Where-Object tag_name -CEQ $env:GITHUB_REF_NAME)
        if ($existing.Count -and !$existing[0].draft) { throw 'Published releases are immutable' }
        if (!$existing.Count) {
          gh release create $env:GITHUB_REF_NAME --verify-tag --draft --title $env:GITHUB_REF_NAME --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed' }
        }
        gh release upload $env:GITHUB_REF_NAME $env:ARCHIVE "$env:ARCHIVE.sha256" --clobber
        if ($LASTEXITCODE -ne 0) { throw 'Artifact upload failed' }
        gh release edit $env:GITHUB_REF_NAME --draft=false --latest=false
        if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
