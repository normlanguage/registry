name: Validate registry

on:
  pull_request:
    paths:
      - registry.json
      - registry.schema.json
      - .github/workflows/validate.yml
  push:
    branches: [main]
    paths:
      - registry.json
      - registry.schema.json
      - .github/workflows/validate.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Validate schema
        run: |
          python -m pip install check-jsonschema==0.38.0
          check-jsonschema --schemafile registry.schema.json registry.json
      - name: Validate unique sorted names
        run: |
          jq -e '
            [.packages[].name] == ([.packages[].name] | sort)
            and (([.packages[].name] | unique | length) == (.packages | length))
          ' registry.json
