name: Package Module

on:
  workflow_call:
    inputs:
      norm-version:
        description: Norm toolchain version
        required: false
        type: string
      norm-source-ref:
        description: Full compiler commit SHA, mutually exclusive with norm-version
        required: false
        type: string
      runner:
        description: Runner for the module's pinned Java platform
        required: false
        type: string
        default: ubuntu-latest

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: normlanguage/registry/.github/actions/setup-norm@d229852448570c786a3f86e62c7db36769ed9a18
        with:
          version: ${{ inputs.norm-version }}
          source-ref: ${{ inputs.norm-source-ref }}
      - name: Locate Module
        id: module
        shell: bash
        run: |
          mapfile -d '' modules < <(find . -type f -name module.norm -not -path './.git/*' -not -path './.tmp/*' -not -path './.norm/*' -not -path './examples/*' -not -path './sample/*' -not -path './samples/*' -print0)
          [[ "${#modules[@]}" == 1 ]]
          echo "path=${modules[0]}" >> "$GITHUB_OUTPUT"
      - name: Package
        shell: bash
        run: |
          norm package "${{ steps.module.outputs.path }}" --output build/repository
          git diff --exit-code -- "${{ steps.module.outputs.path }}"
          mkdir -p "$HOME/.norm/cache/packages/github"
          cp -R build/repository/. "$HOME/.norm/cache/packages/github/"
      - name: Verify module tests
        shell: bash
        run: |
          module_dir="$(dirname "${{ steps.module.outputs.path }}")"
          if [[ -d "$module_dir/tests" ]]; then
            timeout 300 norm test "$module_dir"
          fi
      - name: Verify examples
        shell: bash
        run: |
          while IFS= read -r -d '' entry; do
            timeout 300 norm "$entry"
          done < <(find . -type f -name Main.norm -not -path './.git/*' -not -path './.tmp/*' -not -path './.norm/*' -not -path './build/*' -not -path './samples/*' -print0)
      - name: Select release artifact
        id: artifact
        shell: bash
        run: |
          mapfile -t archives < <(find build/repository -type f -name '*.nar')
          [[ "${#archives[@]}" == 1 ]]
          archive="${archives[0]}"
          version="${archive%.nar}"
          version="${version##*-}"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: ${{ steps.artifact.outputs.archive }}
      - name: Publish immutable release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.artifact.outputs.archive }}
          VERSION: ${{ steps.artifact.outputs.version }}
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" == "v$VERSION" ]]
          state="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          [[ "$state" != "false" ]]
          if [[ "$state" == "missing" ]]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest=false
