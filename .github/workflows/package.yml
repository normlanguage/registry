name: Package Module

on:
  workflow_call:
    inputs:
      norm-version:
        description: Norm toolchain version
        required: false
        type: string
      norm-source-ref:
        description: Full compiler commit SHA, mutually exclusive with norm-version
        required: false
        type: string
      runner:
        description: Runner for the module's pinned Java platform
        required: false
        type: string
        default: ubuntu-latest

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: normlanguage/registry/.github/actions/setup-norm@d229852448570c786a3f86e62c7db36769ed9a18
        with:
          version: ${{ inputs.norm-version }}
          source-ref: ${{ inputs.norm-source-ref }}
      - name: Locate Module
        id: module
        shell: bash
        run: |
          mapfile -d '' modules < <(find . -type f -name module.norm -not -path './.git/*' -not -path './.tmp/*' -not -path './.norm/*' -not -path './examples/*' -not -path './sample/*' -not -path './samples/*' -print0)
          [[ "${#modules[@]}" == 1 ]]
          echo "path=${modules[0]}" >> "$GITHUB_OUTPUT"
          echo "directory=$(dirname "${modules[0]}")" >> "$GITHUB_OUTPUT"
      - id: artifact
        uses: normlanguage/registry/.github/actions/package-module@89c0d966a181d3ba4e6dde4be377708a7f1df566
        with:
          module-path: ${{ steps.module.outputs.directory }}
      - name: Install candidate
        shell: pwsh
        run: |
          $cache = Join-Path $HOME '.norm/cache/packages/github'
          New-Item -ItemType Directory -Force $cache | Out-Null
          Copy-Item -Path 'build/repository/*' -Destination $cache -Recurse -Force
      - name: Verify module tests
        shell: bash
        run: |
          module_dir="$(dirname "${{ steps.module.outputs.path }}")"
          if [[ -d "$module_dir/tests" ]]; then
            timeout 300 norm test "$module_dir"
          fi
      - name: Verify examples
        shell: bash
        run: |
          while IFS= read -r -d '' entry; do
            timeout 300 norm "$entry"
          done < <(find . -type f -name Main.norm -not -path './.git/*' -not -path './.tmp/*' -not -path './.norm/*' -not -path './build/*' -not -path './samples/*' -print0)
      - uses: normlanguage/registry/.github/actions/publish-module@89c0d966a181d3ba4e6dde4be377708a7f1df566
        with:
          archive: ${{ steps.artifact.outputs.archive }}
          version: ${{ steps.artifact.outputs.version }}
